<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'">
  <!-- Film v3 dailies: raw clips as they are generated. Temporary, unlinked, behind the front door, out of search engines. -->
  <meta name="robots" content="noindex">
  <title>Film v3 dailies — Unconventional</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gate.css">
  <link rel="stylesheet" href="css/dailies.css">
  <script src="js/guard.js"></script>
  <script src="js/boot.js"></script>
</head>
<body>
  <main class="dailies" id="main">
    <div class="container">
      <div class="dailies__head">
        <p class="eyebrow">Film v3 · dailies</p>
        <h1 class="dailies__title">Clips as they're made</h1>
        <p class="dailies__note">Raw takes straight from generation, in shot order, sized down for the web. Not graded, not final. The finished film plays on the preview page.</p>
      </div>
      <div class="dailies__grid">
        <figure class="dailies__card">
          <video src="media/film/s2-02.mp4" poster="media/film/s2-02.jpg" controls muted playsinline preload="metadata"></video>
          <figcaption class="dailies__cap">s2-02</figcaption>
        </figure>
        <figure class="dailies__card">
          <video src="media/film/s4-01.mp4" poster="media/film/s4-01.jpg" controls muted playsinline preload="metadata"></video>
          <figcaption class="dailies__cap">s4-01</figcaption>
        </figure>
        <figure class="dailies__card">
          <video src="media/film/s4-02.mp4" poster="media/film/s4-02.jpg" controls muted playsinline preload="metadata"></video>
          <figcaption class="dailies__cap">s4-02</figcaption>
        </figure>
      </div>
    </div>
  </main>
</body>
</html>
